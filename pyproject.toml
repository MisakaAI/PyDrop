[project]
name = "pydrop"
version = "0.1.3"
description = "Not AirDrop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
build = [
    "dmgbuild>=1.6.5; sys_platform == 'darwin'",
    "pillow>=12.0.0",
    "pyinstaller>=6.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
