[project]
name = "pydrop"
version = "0.1.0"
description = "Not AirDrop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
